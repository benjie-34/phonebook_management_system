<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Phone Book{% endblock %}</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body { background:#f4f7fb; color:#243247; }
    .navbar { background:#173b67; }
    .brand-mark { width:36px;height:36px;border-radius:10px;background:#fff;color:#173b67;display:inline-flex;align-items:center;justify-content:center;font-weight:800;margin-right:9px; }
    .page-card { background:#fff;border:0;border-radius:16px;box-shadow:0 8px 28px rgba(22,48,80,.07); }
    .btn-primary { background:#1769aa;border-color:#1769aa; }
    .btn-primary:hover { background:#10558d;border-color:#10558d; }
    .avatar { width:42px;height:42px;border-radius:50%;background:#e5f0fb;color:#1769aa;display:flex;align-items:center;justify-content:center;font-weight:700; }
    .muted { color:#718096; }
    footer { color:#8793a3; }
  </style>
</head>
<body>
<nav class="navbar navbar-dark">
  <div class="container">
    <a class="navbar-brand fw-bold" href="{% url 'contact_list' %}"><span class="brand-mark">PB</span>Phone Book</a>
    <a class="btn btn-light btn-sm fw-semibold" href="{% url 'contact_create' %}">+ Add Contact</a>
  </div>
</nav>
<main class="container py-4 py-md-5">
  {% if messages %}
    {% for message in messages %}
      <div class="alert alert-success alert-dismissible fade show" role="alert">
        {{ message }}<button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
      </div>
    {% endfor %}
  {% endif %}
  {% block content %}{% endblock %}
</main>
<footer class="container text-center small py-4">Phone Book Management System · Django + MySQL</footer>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
